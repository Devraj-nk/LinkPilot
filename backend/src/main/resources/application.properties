# Database (embedded SQLite file, lives next to the running app)
spring.datasource.url=jdbc:sqlite:data/linkpilot.db?journal_mode=WAL&busy_timeout=5000&foreign_keys=on
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite allows only one writer at a time; a bigger pool just trades throughput for SQLITE_BUSY errors
spring.datasource.hikari.maximum-pool-size=1
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Auth (override JWT_SECRET in production - this default is for local dev only)
jwt.secret=${JWT_SECRET:jL8yip4L8m/RBskly+C+TXaQbdj+yO1dls/3vOdkOcM=}
jwt.access-token-expiration-minutes=15
jwt.refresh-token-expiration-days=30

# Used to build the short-link URL that gets encoded into generated QR codes
app.public-base-url=http://localhost:3000
# Comma-separated list of origins allowed to call the API directly (the Next.js app proxies
# through its own origin so this mainly matters for other API consumers)
app.cors.allowed-origins=http://localhost:3000

# ClickHouse (click analytics - optional infra; the app degrades gracefully if unreachable).
# Real credentials (e.g. a ClickHouse Cloud instance) belong in the environment, never here -
# these defaults only cover a local/self-hosted ClickHouse with no auth.
# compress=0: clickhouse-jdbc 0.6.3 fails to decode compressed SELECT responses from at
# least some ClickHouse server versions ("Magic is not correct" IOException on every
# query, reproduced against ClickHouse Cloud) - INSERTs are unaffected, only reads are.
# Disabling compression sidesteps the driver bug; result sets here are small enough that
# the bandwidth cost doesn't matter.
clickhouse.url=${CLICKHOUSE_URL:jdbc:clickhouse://localhost:8123/default?compress=0}
clickhouse.username=${CLICKHOUSE_USERNAME:default}
clickhouse.password=${CLICKHOUSE_PASSWORD:}