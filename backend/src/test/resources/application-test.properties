# In-memory SQLite: a single connection (see maximum-pool-size) makes this safe -
# the whole test class shares the one connection the in-memory DB lives on.
spring.datasource.url=jdbc:sqlite::memory:
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=create-drop

jwt.secret=jL8yip4L8m/RBskly+C+TXaQbdj+yO1dls/3vOdkOcM=
jwt.access-token-expiration-minutes=15
jwt.refresh-token-expiration-days=30

app.public-base-url=http://localhost:3000
app.cors.allowed-origins=http://localhost:3000

# Not expected to be reachable in tests; ClickHouseSchemaInitializer/AnalyticsService
# degrade gracefully when it isn't.
clickhouse.url=jdbc:clickhouse://localhost:8123/default
clickhouse.username=default
clickhouse.password=
